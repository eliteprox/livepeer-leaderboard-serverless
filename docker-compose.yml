services:
  postgres:
    image: postgres:17
    container_name: leaderboard_postgres
    restart: always
    environment:
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: leaderboard
      POSTGRES_DB: leaderboard
    ports:
      - "5432:5432"
    volumes:
      - ./data/:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: leaderboard_clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: livepeer_analytics
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: analytics_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse-init:
    image: clickhouse/clickhouse-server:latest
    container_name: leaderboard_clickhouse_init
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/init-views.sql:/init/init-views.sql:ro
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 2
        clickhouse-client --host clickhouse --port 9000 --user analytics_user --password analytics_password --database livepeer_analytics --multiquery < /init/init-views.sql
        echo "ClickHouse views initialized"

volumes:
  clickhouse_data: {}